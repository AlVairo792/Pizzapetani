<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Petani Pizza Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        jet: '#0a0a0a',
                        surface: '#171717',
                        crimson: '#e11d48',
                        'crimson-hover': '#be123c',
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s ease-out forwards',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(20px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0a0a0a; color: #ffffff; }
    </style>
</head>
<body class="font-sans antialiased selection:bg-crimson selection:text-white flex min-h-screen items-center justify-center p-6 relative overflow-hidden">

    <a href="index.html" class="absolute top-6 left-6 text-sm font-light text-gray-400 hover:text-white flex items-center space-x-2 transition-colors duration-200 group z-50">
        <svg class="w-4 h-4 transform group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
        </svg>
        <span>Kembali</span>
    </a>

    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-crimson/10 rounded-full blur-[100px] -z-10 pointer-events-none"></div>

    <div class="w-full max-w-md bg-surface/60 border border-white/5 backdrop-blur-xl p-8 rounded-3xl shadow-[0_20px_50px_rgba(0,0,0,0.5)] opacity-0 animate-fade-in-up">
        
        <div class="flex flex-col items-center mb-8 text-center">
            <img 
                src="17284.png" 
                alt="Petani Pizza Logo" 
                class="h-24 w-auto mb-4"
                style="filter: drop-shadow(0 4px 6px rgba(0,0,0,0.4));"
            >
            <h1 class="text-2xl font-black tracking-tight mb-1">SELAMAT DATANG</h1>
            <p class="text-xs text-gray-400 font-light tracking-wide uppercase">Masuk untuk memesan artisan pizza Anda</p>
        </div>

        <form action="#" method="POST" class="space-y-5">
            
            <div>
                <label for="email" class="block text-xs font-medium tracking-wider text-gray-400 uppercase mb-2">Alamat Email</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path></svg>
                    </span>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required
                        placeholder="nama@email.com" 
                        class="w-full bg-jet/80 border border-white/10 rounded-xl py-3.5 pl-11 pr-4 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-crimson focus:ring-1 focus:ring-crimson transition-all duration-200"
                    >
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="password" class="block text-xs font-medium tracking-wider text-gray-400 uppercase">Kata Sandi</label>
                    <a href="#" class="text-xs font-light text-gray-400 hover:text-crimson transition-colors">Lupa Password?</a>
                </div>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-gray-500">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                    </span>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        placeholder="••••••••" 
                        class="w-full bg-jet/80 border border-white/10 rounded-xl py-3.5 pl-11 pr-4 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-crimson focus:ring-1 focus:ring-crimson transition-all duration-200"
                    >
                </div>
            </div>

            <div class="flex items-center">
                <input 
                    type="checkbox" 
                    id="remember" 
                    class="h-4 w-4 bg-jet border-white/10 rounded text-crimson focus:ring-offset-0 focus:ring-crimson"
                >
                <label for="remember" class="ml-2 text-xs font-light text-gray-400 select-none">Ingat saya di perangkat ini</label>
            </div>

            <div class="pt-2">
                <button type="submit" class="group relative w-full py-3.5 bg-crimson text-white text-sm font-semibold rounded-xl overflow-hidden shadow-[0_0_20px_rgba(225,29,72,0.2)] transition-all duration-300 hover:shadow-[0_0_30px_rgba(225,29,72,0.4)] hover:-translate-y-0.5">
                    <span class="relative z-10">Masuk Aplikasi</span>
                    <div class="absolute inset-0 bg-crimson-hover translate-y-full group-hover:translate-y-0 transition-transform duration-300 ease-out z-0"></div>
                </button>
            </div>
        </form>

        <div class="relative my-6 flex items-center justify-center">
            <div class="absolute inset-0 w-full border-t border-white/5"></div>
            <span class="relative bg-[#171717] px-4 text-[10px] uppercase tracking-widest text-gray-500">Atau masuk dengan</span>
        </div>

        <button class="w-full bg-jet hover:bg-white/5 border border-white/10 text-gray-300 hover:text-white py-3 rounded-xl text-xs font-medium flex items-center justify-center space-x-2 transition-all duration-200">
            <svg class="w-4 h-4" viewBox="0 0 24 24">
                <path fill="currentColor" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                <path fill="currentColor" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                <path fill="currentColor" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" fill="#FBBC05"/>
                <path fill="currentColor" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" fill="#EA4335"/>
            </svg>
            <span>Google Account</span>
        </button>

        <p class="mt-8 text-center text-xs font-light text-gray-500">
            Belum punya akun? 
            <a href="#" class="font-normal text-crimson hover:underline pl-1">Daftar sekarang</a>
        </p>

    </div>

</body>
</html>
